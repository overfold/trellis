name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.9

      - name: Build reproducible static release
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"

      - name: Verify release platform compatibility
        run: bash scripts/release-platform_test.sh "$RUNNER_TEMP/release/trellis_linux_x64.tar.gz" "${{ github.ref_name }}" ubuntu:20.04 ubuntu:24.04 debian:12

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish tutorial images
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/trellis-tutorial
        run: |
          for tutorial_version in v1 v2 network-v1; do
            # Tutorial versions are stable learning fixtures. Once published,
            # a later Trellis release must not silently replace their contents.
            if docker manifest inspect "${IMAGE}:${tutorial_version}" >/dev/null 2>&1; then
              echo "${IMAGE}:${tutorial_version} already exists; leaving it unchanged"
              continue
            fi
            docker build \
              --build-arg "TUTORIAL_VERSION=${tutorial_version}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${IMAGE}:${tutorial_version}" \
              tutorial
            docker push "${IMAGE}:${tutorial_version}"
          done

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            ${{ runner.temp }}/release/trellis_linux_x64.tar.gz
            ${{ runner.temp }}/release/trellis_linux_x64.tar.gz.sha256
            ${{ runner.temp }}/release/trellis_linux_x64.build-info
          body: |
            Linux x86-64 assets are built with Go 1.26.9, CGO_ENABLED=0 and GOAMD64=v1; no host libc is required. Binary execution is checked on Ubuntu 20.04, Ubuntu 24.04 and Debian 12 userspace. Host kernel, systemd, networking and containerd prerequisites still apply. See the release-matched Operations guide for coordinated upgrade boundaries.
          generate_release_notes: true
