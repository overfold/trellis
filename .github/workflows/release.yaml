name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.4

      - name: Build binaries
        working-directory: orchestrator
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p bin
          LDFLAGS="-X github.com/clofour/trellis/internal/version.version=${VERSION}"
          go build -ldflags "${LDFLAGS}" -o bin/trellis ./cmd/trellis
          go build -ldflags "${LDFLAGS}" -o bin/trellisctl ./cmd/trellisctl
          CGO_ENABLED=0 go build -o bin/trellis-health-probe ./cmd/trellis-health-probe

      - name: Package binaries
        working-directory: orchestrator
        run: tar -czf ../trellis_linux_x64.tar.gz -C bin trellis trellisctl trellis-health-probe

      - name: Package UI source
        run: tar -czf trellis_ui.tar.gz -C ui --exclude node_modules --exclude .next .

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish UI container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/trellis-ui
          VERSION: ${{ github.ref_name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            ui
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"

      - name: Build and publish tutorial images
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/trellis-tutorial
        run: |
          for tutorial_version in v1 v2 network-v1; do
            # Tutorial versions are stable learning fixtures. Once published,
            # a later Trellis release must not silently replace their contents.
            if docker manifest inspect "${IMAGE}:${tutorial_version}" >/dev/null 2>&1; then
              echo "${IMAGE}:${tutorial_version} already exists; leaving it unchanged"
              continue
            fi
            docker build \
              --build-arg "TUTORIAL_VERSION=${tutorial_version}" \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${{ github.sha }}" \
              --tag "${IMAGE}:${tutorial_version}" \
              tutorial
            docker push "${IMAGE}:${tutorial_version}"
          done

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            trellis_linux_x64.tar.gz
            trellis_ui.tar.gz
          generate_release_notes: true
