name: orchestrator-build
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: orchestrator-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.4

      - name: Create build directory
        run: mkdir -p orchestrator/bin

      - name: Build Trellis node
        working-directory: orchestrator
        run: CGO_ENABLED=0 go build -o bin/trellis ./cmd/trellis

      - name: Verify Trellis node is static
        working-directory: orchestrator
        run: '! readelf -l bin/trellis | grep -q INTERP'

      - name: Build Trellis CLI
        working-directory: orchestrator
        run: go build -o bin/trellisctl ./cmd/trellisctl

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trellis_linux_x64
          path: |
            orchestrator/bin/trellis
            orchestrator/bin/trellisctl
