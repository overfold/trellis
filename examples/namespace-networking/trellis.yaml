# yaml-language-server: $schema=https://raw.githubusercontent.com/overfold/trellis/main/schemas/trellis-job.schema.json
name: namespace-networking
namespace: default
task_groups:
  - name: web
    count: 2
    tasks:
      - name: tutorial
        image: ghcr.io/overfold/trellis-tutorial:network-v1
        networking:
          mode: namespace
        resources:
          cpu: 100
          memory: 64MiB
  - name: observer
    count: 1
    tasks:
      - name: tutorial
        image: ghcr.io/overfold/trellis-tutorial:network-v1
        env:
          TUTORIAL_PEER_URL: http://web.namespace-networking.default.trellis:8080/health
        networking:
          mode: namespace
        resources:
          cpu: 100
          memory: 64MiB
