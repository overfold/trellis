name: patroni
namespace: database
task_groups:
  - name: postgres-1
    count: 1
    runtime: runsc
    labels:
      service: patroni
      role: database
    constraints:
      - attribute: patroni-member
        value: "1"
    restart:
      max_restarts: 5
      window: 10m
    update:
      strategy: recreate
    tasks:
      - name: patroni
        image: ghcr.io/zalando/spilo-17:4.0-p2
        env:
          PATRONI_SCOPE: trellis-patroni
          PATRONI_NAME: trellis-member-1
          PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
          PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
        networking:
          mode: namespace
        secrets:
          - name: postgres-password
            target: env
            env: PGPASSWORD_SUPERUSER
          - name: replication-password
            target: env
            env: PGPASSWORD_STANDBY
        volumes:
          - name: postgres-data-1
            host_path: "@/patroni/member-1"
            container_path: /home/postgres/pgroot
        resources:
          cpu: 1000
          memory: 2147483648
        health_check:
          type: script
          command: [curl, --fail, --silent, http://127.0.0.1:8008/health]
          interval: 10s
          timeout: 3s
          threshold: 3

  - name: postgres-2
