version: "2"
run:
  # The integration build is a superset of the default build, so linting it
  # covers the multi-process suite and the integration-only runtime wiring too.
  # Avoid `!integration` files: they would not be linted.
  build-tags:
    - integration
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - unparam
    - unused
    - errorlint
    - musttag
    - exhaustive
    - noctx
    - bodyclose
    - errchkjson
    - gosec
    - copyloopvar
    - nilerr
    - durationcheck
    - makezero
    - fatcontext
    - errname
    - recvcheck
    - testifylint
    - tparallel
    - mirror
    - canonicalheader
    - nolintlint
    - modernize
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    errchkjson:
      check-error-free-encoding: true
    gosec:
      excludes:
        - G301
        - G302
        - G304
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx
          - gosec
